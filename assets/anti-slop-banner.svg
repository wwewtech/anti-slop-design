<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0f1013"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Subtle Accent Glow -->
    <radialGradient id="cobaltGlow" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Accent Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#cobaltGlow)"/>
  <rect width="1200" height="460" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="1160" height="420" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Status Pill -->
  <g transform="translate(60, 55)">
    <rect width="210" height="32" rx="16" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#10b981"/>
    <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" letter-spacing="0.5">HUMAN-GRADE UI / UX</text>
  </g>

  <!-- Ecosystem Badges (Top Right) -->
  <g transform="translate(820, 55)">
    <rect width="320" height="32" rx="16" fill="#141417" stroke="#27272a" stroke-width="1"/>
    <text x="160" y="20.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#71717a">
      <tspan fill="#3b82f6">skills.sh</tspan> · <tspan fill="#e2e8f0">Claude Code</tspan> · <tspan fill="#a855f7">Cursor</tspan> · <tspan fill="#4285f4">Antigravity</tspan>
    </text>
  </g>

  <!-- Main Title -->
  <text x="60" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    ANTI-SLOP DESIGN
  </text>

  <!-- Subtitle -->
  <text x="60" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="20" font-weight="400" fill="#a1a1aa" letter-spacing="-0.2">
    The Autonomous Principal Design Technologist Skill for AI Coding Agents
  </text>

  <!-- Divider Line -->
  <line x1="60" y1="235" x2="1140" y2="235" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Core Pillars Grid -->
  <!-- Card 1: Anti-Patterns Banned -->
  <g transform="translate(60, 260)">
    <rect width="340" height="140" rx="12" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ef4444" letter-spacing="0.5">BANNED AI CLICHÉS</text>
    <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#e4e4e7">✕ Purple radial glow blobs</text>
    <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#e4e4e7">✕ Raw emojis as UI icons</text>
    <text x="20" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#e4e4e7">✕ Redundant duplicated KPIs</text>
  </g>

  <!-- Card 2: Commercial Speed & UX -->
  <g transform="translate(430, 260)">
    <rect width="340" height="140" rx="12" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#3b82f6" letter-spacing="0.5">COMMERCIAL UX ENGINE</text>
    <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#e4e4e7">✓ 1-to-3 Focus Hierarchy rule</text>
    <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#e4e4e7">✓ 85% Statistical prioritization</text>
    <text x="20" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#e4e4e7">✓ Mobile linearity on desktop</text>
  </g>

  <!-- Card 3: Quality Floor -->
  <g transform="translate(800, 260)">
    <rect width="340" height="140" rx="12" fill="#121215" stroke="#27272a" stroke-width="1"/>
    <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#10b981" letter-spacing="0.5">7-AXIS QUALITY GATE</text>
    <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#e4e4e7">✓ 8-State interactive feedback</text>
    <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#e4e4e7">✓ WCAG 2.1 AA keyboard flow</text>
    <text x="20" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#e4e4e7">✓ Strict 4px/8pt geometric grid</text>
  </g>
</svg>
