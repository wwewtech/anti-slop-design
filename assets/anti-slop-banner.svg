<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 56px;
        letter-spacing: -0.04em;
        fill: #ffffff;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        letter-spacing: -0.01em;
        fill: #888888;
      }
      .terminal-box {
        fill: #0c0c0c;
        stroke: #222222;
        stroke-width: 1;
      }
      .mono-text {
        font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
        font-size: 15px;
        fill: #e5e5e5;
      }
      .mono-dim {
        font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
        font-size: 15px;
        fill: #555555;
      }
      .badge-text {
        font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.05em;
        fill: #777777;
      }
    </style>
  </defs>

  <!-- Solid Deep Obsidian Canvas (Zero Fuzzy Gradients) -->
  <rect width="1200" height="380" fill="#050505"/>

  <!-- Minimal Hairline Frame -->
  <rect x="24" y="24" width="1152" height="332" rx="6" fill="none" stroke="#1c1c1c" stroke-width="1"/>

  <!-- Top Technical Anchor Rule -->
  <line x1="24" y1="72" x2="1176" y2="72" stroke="#161616" stroke-width="1"/>
  <text x="56" y="53" class="badge-text">WWEW.TECH / SPEC-01</text>
  <text x="1144" y="53" text-anchor="end" class="badge-text">AUTONOMOUS DESIGN AGENT · v1.0.0</text>

  <!-- Left: Pure Swiss Geometric Monogram Mark -->
  <g transform="translate(56, 120)">
    <!-- Outer Precision Square (64x64) -->
    <rect x="0" y="0" width="72" height="72" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- Diagonal Precision Slice -->
    <line x1="0" y1="72" x2="72" y2="0" stroke="#ffffff" stroke-width="2"/>
    <!-- Center Dot Indicator -->
    <circle cx="36" cy="36" r="4" fill="#ffffff"/>
  </g>

  <!-- Main Identity Block -->
  <g transform="translate(156, 150)">
    <text x="0" y="24" class="title">anti-slop-design</text>
    <text x="0" y="64" class="subtitle">Autonomous Principal Design Technologist for AI coding agents</text>
  </g>

  <!-- Bottom Terminal Command Anchor (One Clean Box, Zero Card Slop) -->
  <g transform="translate(56, 260)">
    <rect width="640" height="52" rx="4" class="terminal-box"/>
    <text x="24" y="32">
      <tspan class="mono-dim">$ </tspan>
      <tspan class="mono-text">npx skills add wwewtech/anti-slop-design</tspan>
    </text>
  </g>

  <!-- Bottom Right Ecosystem Support -->
  <g transform="translate(1144, 292)">
    <text x="0" y="0" text-anchor="end" class="badge-text">CLAUDE CODE · CURSOR · ANTIGRAVITY · SKILLS.SH</text>
  </g>
</svg>
